<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Wishes Hub</title>
    <link rel="stylesheet" href="../style-ui.css">
</head>
<body>

    <header class="main-header">
        <h1 onclick="window.location.href='../index.html'" style="cursor: pointer;">Wishes Hub</h1>
        <div id="header-actions">
            <a href="../index.html" style="color: var(--primary-neon); font-size: 14px; font-weight: 600;">← Back to Home</a>
        </div>
    </header>

    <div class="main-container">
        <section class="trending-box contact-card-box">
            <h2>Contact Us</h2>
            <p>Agar aapka koi sawaal ya feedback hai, toh niche diye gaye form ke jariye humse sampark karein.</p>

            <form id="contact-form" class="contact-form-layout" onsubmit="handleContactSubmit(event)">
                <div class="form-group-block">
                    <label>Your Name</label>
                    <input type="text" id="contact-name" required placeholder="Enter your name">
                </div>

                <div class="form-group-block">
                    <label>Email Address</label>
                    <input type="email" id="contact-email" required placeholder="Enter your email">
                </div>

                <div class="form-group-block">
                    <label>Message</label>
                    <textarea id="contact-message" rows="5" required placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="contact-submit-btn">
                    Send Message
                </button>
            </form>
        </section>
    </div>

    <footer class="main-footer">
        <p>&copy; 2026 Wishes Hub | Developed by Patel Studio</p>
    </footer>

    <script src="../js/ui-interactions.js"></script>
</body>
</html>
