<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes-hub</title>
    
    <!-- Eruda Console for Debugging -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>
    <div class="main-container">
        <section>
            <h2>Browse Categories</h2>
            <div class="categories-container-wrapper"></div>
        </section>
        <section>
            <h2>Wish of the Day</h2>
            <div id="daily-wish-text">Loading...</div>
        </section>
        <section>
            <h2>Latest Wishes</h2>
            <div id="wishes-grid"></div>
        </section>
    </div>

    <!-- Script Block -->
    <script type="module">
        console.log("Status: Script tag execute ho raha hai...");

        import Assembly from './main-assembly.js';
        
        console.log("Status: Assembly module import ho gaya:", Assembly);
        
        // Engine ko start karein
        if (Assembly && typeof Assembly.initAll === 'function') {
            Assembly.initAll()
                .then(() => console.log("Status: All systems operational."))
                .catch(err => console.error("Critical System Failure:", err));
        } else {
            console.error("Error: Assembly object ya initAll function nahi mila!");
        }
    </script>
</body>
</html>
