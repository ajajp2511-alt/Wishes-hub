<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes-hub - Direct Test</title>
    <!-- Eruda Console for Debugging -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>
    <div class="main-container">
        <h1>Storage Test System</h1>
        <div id="status">Checking storage assembly...</div>
    </div>

    <!-- Direct Storage Assembly Import -->
    <script type="module">
        import initStorageManager from './features/storage/storage-assembly.js';

        try {
            console.log("TEST: Loading storage assembly directly...");
            const result = initStorageManager();
            document.getElementById('status').innerText = "Success! Storage loaded.";
            console.log("TEST: Storage result:", result);
        } catch (err) {
            console.error("TEST: Failed to load storage:", err);
            document.getElementById('status').innerText = "Error: Check Console.";
        }
    </script>
</body>
</html>
