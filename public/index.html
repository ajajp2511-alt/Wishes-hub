<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes-hub - Storage Manager</title>
    <!-- Eruda Console for Debugging -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>
    <div class="main-container">
        <h1>Wishes Hub System</h1>
        <div id="status">Initializing Storage...</div>
        
        <!-- Wishes Grid -->
        <div id="wishes-grid"></div>
    </div>

    <!-- Storage Assembly Import Script -->
    <script type="module">
        console.log("LOG: Initializing Storage Assembly...");
        try {
            // Storage assembly file ko import kiya ja raha hai
            const initStorageManager = await import('./features/storage/storage-assembly.js');
            
            // Function ko call karke StorageCore instance liya
            const StorageCore = initStorageManager.default();
            
            // StorageCore ki init method chalayi
            await StorageCore.init();
            
            console.log("LOG: Storage Assembly Loaded Successfully!");
            document.getElementById('status').innerText = "Storage System Online!";
            
        } catch (error) {
            console.error("LOG: Storage Load Failed:", error);
            document.getElementById('status').innerText = "Error: " + error.message;
        }
    </script>
</body>
</html>
