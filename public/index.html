<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishes Hub</title>

  <!-- Eruda Console Debugger -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- Direct Style Block for Instant Testing -->
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #ffffff;
      color: #000000;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Dark Mode Direct Class */
    body.dark-theme {
      background-color: #121212 !important;
      color: #ffffff !important;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #ccc;
    }

    body.dark-theme .app-header {
      border-bottom-color: #444;
    }

    .theme-btn {
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #888;
      background-color: #f0f0f0;
      color: #000;
    }

    body.dark-theme .theme-btn {
      background-color: #333;
      color: #fff;
      border-color: #666;
    }

    input {
      padding: 8px;
      margin: 5px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    body.dark-theme input {
      background-color: #222;
      color: #fff;
      border-color: #555;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <h1>Wishes Hub</h1>
    <button id="theme-toggle-btn" class="theme-btn">🌙 Theme</button>
  </header>

  <!-- Main Container -->
  <main class="main-container">
    <div class="input-group">
      <input type="text" id="user-name-input" placeholder="Apna Naam Likhein...">
    </div>

    <div class="search-group">
      <input type="text" id="search-input" placeholder="Wishes khojein...">
      <button id="clear-search-btn" class="clear-btn">✕</button>
    </div>

    <div class="filter-tags">
      <button class="filter-btn active">All</button>
      <button class="filter-btn">Birthday</button>
      <button class="filter-btn">Anniversary</button>
    </div>

    <div id="wishes-list" class="wishes-container"></div>
  </main>

  <!-- DIRECT THEME SCRIPT (No Assembly / External Modules) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const themeBtn = document.getElementById('theme-toggle-btn');
      const STORAGE_KEY = 'wishes_hub_theme';

      // 1. Saved Theme Check on Load
      const savedTheme = localStorage.getItem(STORAGE_KEY);
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-theme');
        if (themeBtn) themeBtn.textContent = '☀️ Light';
      }

      // 2. Direct Click Event Listener
      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          const isDark = document.body.classList.toggle('dark-theme');
          
          if (isDark) {
            themeBtn.textContent = '☀️ Light';
            localStorage.setItem(STORAGE_KEY, 'dark');
            console.log('🌙 Dark Mode Activated');
          } else {
            themeBtn.textContent = '🌙 Theme';
            localStorage.setItem(STORAGE_KEY, 'light');
            console.log('☀️ Light Mode Activated');
          }
        });
      } else {
        console.error('❌ Theme Button not found in DOM!');
      }
    });
  </script>
</body>
</html>
