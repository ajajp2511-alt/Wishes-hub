<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishes Hub - Special Event Greetings</title>

  <!-- Root Master Style in /js Directory -->
  <link rel="stylesheet" href="./js/style-css.css">

  <!-- Feature Modules CSS Files -->
  <link rel="stylesheet" href="./js/dark-mode/assets/style-css.css">
  <link rel="stylesheet" href="./js/music-player/assets/style-css.css">
  <link rel="stylesheet" href="./js/search-filter/assets/style-css.css">
  <link rel="stylesheet" href="./js/whatsapp-share/assets/style-css.css">
  <link rel="stylesheet" href="./js/ads-manager/assets/style-css.css">
  <link rel="stylesheet" href="./js/seo-helper/assets/style-css.css">
</head>
<body>

  <!-- Header Section -->
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid rgba(0,0,0,0.1);">
    <h1 style="margin: 0; font-size: 1.5rem;">Wishes Hub</h1>
    
    <!-- Dark Mode Toggle Button -->
    <button id="dark-mode-toggle" class="theme-toggle-btn">🌙 Theme</button>
  </header>

  <main style="max-width: 800px; margin: 0 auto; padding: 20px;">
    
    <!-- Top Ad Banner Slot -->
    <div class="ads-container" data-ad-slot="1234567890"></div>

    <!-- Personalization Input (Sender Name) -->
    <div style="margin: 20px 0; text-align: center;">
      <input 
        type="text" 
        id="sender-name-input" 
        placeholder="Apna Naam Likhein..." 
        style="padding: 10px 18px; border-radius: 20px; border: 1px solid #ccc; width: 80%; max-width: 350px; outline: none;"
      >
    </div>

    <!-- Search & Filter Bar -->
    <div class="search-box-container">
      <input type="text" id="search-input" class="search-input" placeholder="Wishes khojein (e.g. Birthday, Anniversary)...">
      <button id="search-clear-btn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1rem;">✕</button>
    </div>

    <!-- Category Filter Tabs -->
    <div class="category-filter-bar" style="justify-content: center; margin: 15px 0;">
      <button class="category-btn active" data-category="all">All</button>
      <button class="category-btn" data-category="birthday">Birthday</button>
      <button class="category-btn" data-category="anniversary">Anniversary</button>
    </div>

    <!-- Dynamic Wishes List Container -->
    <section id="wishes-list" style="margin-top: 25px; display: grid; gap: 15px;">
      <!-- Wish cards features-assembly.js se dynamically yahan render honge -->
    </section>

    <!-- Bottom Ad Banner Slot -->
    <div class="ads-container" data-ad-slot="0987654321"></div>

  </main>

  <!-- Sticky Bottom Music Player -->
  <div style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
    <div class="music-player-container">
      <button id="music-play-pause" class="music-btn">▶️</button>
      <div id="music-progress" class="progress-bar-container" style="width: 100px;">
        <div class="progress-fill"></div>
      </div>
      <input type="range" id="music-volume" min="0" max="100" value="50" style="width: 60px;">
    </div>
  </div>

  <!-- Root JS Feature Orchestration Script -->
  <script type="module" src="./js/features-assembly.js"></script>

</body>
</html>
