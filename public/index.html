<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes-hub</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>
    <div class="main-container">
        <section>
            <input type="text" id="search-input" placeholder="Wishes search karein..." style="width:100%; padding:10px;">
        </section>
        <section id="latest-wishes-section">
            <h2>Wish of the Day</h2>
            <div id="daily-wish-text">Loading...</div>
            <h2>Latest Wishes</h2>
            <div id="wishes-grid"></div>
        </section>
    </div>

    <script type="module">
        console.log("DEBUG: HTML script tag load hua");
        import Assembly from './main-assembly.js';
        console.log("DEBUG: Module import ho gaya");
        
        Assembly.initAll()
            .then(() => console.log("DEBUG: All systems operational"))
            .catch(err => console.error("DEBUG: Crash hua:", err));
    </script>
</body>
</html>
