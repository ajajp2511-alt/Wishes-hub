<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes-hub - Step by Step Test</title>
    <!-- Eruda Console for Debugging -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>
    <div class="main-container">
        <h1>Step-by-Step Path Test</h1>
        <div id="status">Checking Assembly File...</div>
    </div>

    <!-- Complete Test Script -->
    <script type="module">
        console.log("LOG: Test script started.");
        try {
            console.log("LOG: Importing storage-assembly.js...");
            
            const storageModule = await import('./features/storage/storage-assembly.js');
            console.log("LOG: Module imported:", storageModule);
            
            const result = storageModule.default();
            console.log("LOG: Function executed:", result);
            
            document.getElementById('status').innerText = "Success: " + result.status;

        } catch (error) {
            console.error("LOG: Error caught:", error);
            document.getElementById('status').innerText = "Error: " + error.message;
        }
    </script>
</body>
</html>
