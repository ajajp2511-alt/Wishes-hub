<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes-hub Test</title>
    <!-- Eruda Console for Debugging -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>
    <div class="main-container">
        <h1>System Testing...</h1>
        <div id="status">Checking console for logs...</div>
    </div>

    <script type="module">
        console.log("TEST: HTML load ho gaya, ab Assembly import kar rahe hain...");
        
        try {
            // Assembly import
            const module = await import('./main-assembly.js');
            
            if (module.default && typeof module.default.initAll === 'function') {
                await module.default.initAll();
                document.getElementById('status').innerText = "System loaded successfully!";
            } else {
                document.getElementById('status').innerText = "Error: initAll not found.";
            }
        } catch (err) {
            console.error("TEST: Error loading assembly:", err);
            document.getElementById('status').innerText = "Error: Check Console.";
        }
    </script>
</body>
</html>
