<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes-hub - Direct Test</title>
    <!-- Eruda Console -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>
    <div class="main-container">
        <h1>Storage Test System</h1>
        <div id="status">Loading...</div>
    </div>

    <script type="module">
        console.log("LOG: Script execution started.");
        try {
            console.log("LOG: Attempting to import storage-assembly.js...");
            const module = await import('./features/storage/storage-assembly.js');
            console.log("LOG: Import successful!", module);
            document.getElementById('status').innerText = "Loaded successfully!";
        } catch (error) {
            console.error("LOG: Import failed with error:", error);
            document.getElementById('status').innerText = "Error: " + error.message;
        }
    </script>
</body>
</html>
