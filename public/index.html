<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishes Hub</title>

  <!-- Eruda Debugger -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
    console.log("🛠️ Eruda initialized successfully!");
  </script>

  <!-- Master Modular CSS -->
  <link rel="stylesheet" href="./js/style-css.css">

  <!-- Direct Test Script to verify execution -->
  <script type="module">
    console.log("🔥 Direct Inline Module Test Running...");
  </script>

  <!-- JS Modules Orchestrator -->
  <script type="module" src="./js/features-assembly.js"></script>
</head>
<body>

  <header class="app-header">
    <h1>Wishes Hub</h1>
    <button id="theme-toggle-btn" class="theme-btn">🌙 Theme</button>
  </header>

  <main class="main-container">
    <div class="input-group">
      <input type="text" id="user-name-input" placeholder="Apna Naam Likhein...">
    </div>

    <div class="search-group">
      <input type="text" id="search-input" placeholder="Wishes khojein...">
      <button id="clear-search-btn" class="clear-btn">✕</button>
    </div>

    <div class="filter-tags">
      <button class="filter-btn active" data-category="All">All</button>
      <button class="filter-btn" data-category="Birthday">Birthday</button>
      <button class="filter-btn" data-category="Anniversary">Anniversary</button>
    </div>

    <div id="wishes-list" class="wishes-container"></div>
  </main>

</body>
</html>
