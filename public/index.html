<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes-hub - JS Folder Test</title>
    <!-- Eruda Console for Debugging -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>
    <div class="main-container">
        <h1>JS Folder Connection Test</h1>
        <div id="status">Connecting to js/test.js...</div>
    </div>

    <!-- Test Script Loader -->
    <script type="module">
        console.log("LOG: Checking js folder connection...");
        try {
            // js folder se test.js ko import kiya ja raha hai
            const testModule = await import('./js/test.js');
            console.log("LOG: Import successful!", testModule);
            
            const message = testModule.showTestMessage();
            document.getElementById('status').innerText = "Success: " + message;
            
        } catch (error) {
            console.error("LOG: Connection Failed:", error);
            document.getElementById('status').innerText = "Error: " + error.message;
        }
    </script>
</body>
</html>
