<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishes Hub</title>

  <!-- Eruda Mobile Console Debugger -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- Root CSS -->
  <link rel="stylesheet" href="./style-css.css">

  <!-- Master JS Orchestrator -->
  <script type="module" src="./js/features-assembly.js"></script>
</head>
<body>

  <!-- Header Section -->
  <header class="app-header">
    <h1>Wishes Hub</h1>
    <button id="theme-toggle-btn" class="theme-btn">🌙 Theme</button>
  </header>

  <!-- Main Container -->
  <main class="main-container">
    <!-- User Input -->
    <div class="input-group">
      <input type="text" id="user-name-input" placeholder="Apna Naam Likhein...">
    </div>

    <!-- Search Section -->
    <div class="search-group">
      <input type="text" id="search-input" placeholder="Wishes khojein...">
      <button id="clear-search-btn" class="clear-btn">✕</button>
    </div>

    <!-- Category Filters -->
    <div class="filter-tags">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="birthday">Birthday</button>
      <button class="filter-btn" data-category="anniversary">Anniversary</button>
    </div>

    <!-- Wishes Card Container (JS Dynamic Output) -->
    <div id="wishes-list" class="wishes-container"></div>
  </main>

  <!-- Bottom Audio Player -->
  <footer class="audio-player-footer">
    <div class="player-controls">
      <button id="play-pause-btn" class="play-btn">▶️</button>
      <input type="range" id="audio-progress" value="0">
      <input type="range" id="volume-control" min="0" max="1" step="0.1" value="0.8">
    </div>
  </footer>

</body>
</html>
