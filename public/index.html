<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes-hub</title>
    
    <!-- Master CSS -->
    <link rel="stylesheet" href="public/features/style-css.css">
</head>
<body>

    <canvas id="animation-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1;"></canvas>

    <div class="main-container">

        <!-- Categories Section -->
        <section>
            <div class="section-header"><h2>Browse Categories</h2></div>
            <div class="categories-container-wrapper"></div>
        </section>

        <!-- Wish of the Day -->
        <section id="wish-of-the-day-section">
            <div class="wish-of-the-day-banner">
                <span class="banner-badge">Wish of the Day</span>
                <p class="banner-text" id="daily-wish-text">Loading...</p>
            </div>
        </section>

        <!-- Dynamic Wishes Grid -->
        <section>
            <div class="section-header"><h2>Latest Wishes</h2></div>
            <div id="wishes-grid" class="grid-container wishes-feed-container">
                <p>Initializing Wishes-hub Engine...</p>
            </div>
        </section>

    </div>

    <!-- Master Script -->
    <script type="module">
        import Assembly from './public/features/assembly.js';
        
        console.log("Index: Loading Assembly...");
        Assembly.initAll();
    </script>

</body>
</html>
