<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes-hub</title>
    <!-- Eruda Console for Debugging -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>
    <div class="main-container">
        <h1>Wishes-hub System</h1>
        <div id="status">Loading systems...</div>
    </div>

    <!-- Main Logic Script: Yahan ./main.js ka use karein -->
    <script type="module">
        console.log("TEST: HTML load ho gaya, ab main.js load kar rahe hain...");
        
        // Import karte samay path ko verify karein
        import('./main.js').then((module) => {
            const Assembly = module.default;
            if (Assembly && typeof Assembly.initAll === 'function') {
                Assembly.initAll().then(() => {
                    document.getElementById('status').innerText = "System loaded successfully!";
                });
            } else {
                document.getElementById('status').innerText = "Error: initAll function nahi mila.";
            }
        }).catch((err) => {
            console.error("TEST: Error loading main.js:", err);
            document.getElementById('status').innerText = "Error: Check Console.";
        });
    </script>
</body>
</html>
