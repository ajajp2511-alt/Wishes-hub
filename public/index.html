<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes-hub</title>
    
    <!-- Eruda Console for Debugging -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>
    <div class="main-container">
        <!-- Search Input jo script dhund rahi hai -->
        <section>
            <input type="text" id="search-input" placeholder="Wishes search karein..." style="width:100%; padding:10px; margin-bottom:10px;">
        </section>

        <section>
            <h2>Browse Categories</h2>
            <div class="categories-container-wrapper"></div>
        </section>

        <section id="latest-wishes-section">
            <h2>Wish of the Day</h2>
            <div id="daily-wish-text">Loading...</div>
            
            <h2>Latest Wishes</h2>
            <div id="wishes-grid"></div>
        </section>
    </div>

    <!-- Yahan type="module" lagana zaroori hai -->
    <script type="module" src="main-assembly.js"></script>
</body>
</html>
