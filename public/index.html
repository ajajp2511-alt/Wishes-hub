<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes-hub</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>
    <div class="main-container">
        <section>
            <input type="text" id="search-input" placeholder="Wishes search karein..." style="width:100%; padding:10px; margin-bottom:10px;">
        </section>
        <section>
            <h2>Browse Categories</h2>
            <div class="categories-container-wrapper"></div>
        </section>
        <section id="latest-wishes-section">
            <h2>Wish of the Day</h2>
            <div id="daily-wish-text">Loading...</div>
            <h2>Latest Wishes</h2>
            <div id="wishes-grid"></div>
        </section>
    </div>

    <script type="module">
        console.log("TEST: HTML load ho gaya, ab assembly load kar rahe hain...");
        try {
            // Relative path use kiya hai (server public folder ko root manta hai)
            const module = await import('./main-assembly.js');
            if (module.default && typeof module.default.initAll === 'function') {
                await module.default.initAll();
                console.log("TEST: Success! System operational.");
            }
        } catch (err) {
            console.error("TEST: Error loading assembly:", err);
        }
    </script>
</body>
</html>
