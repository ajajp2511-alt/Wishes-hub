<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishes Hub</title>

  <!-- Eruda Debugger -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
    console.log("🛠️ Eruda initialized successfully!");
  </script>

  <!-- Master Modular CSS -->
  <link rel="stylesheet" href="./js/style-css.css">

  <!-- Direct Test Script to verify execution -->
  <script type="module">
    console.log("🔥 Direct Inline Module Test Running...");
  </script>

  <!-- JS Modules Orchestrator (Added ?v=2 for Cache Busting) -->
  <script type="module" src="./js/features-assembly.js?v=2"></script>
</head>
<body>

  <!-- Side Drawer Navigation Container Target -->
  <div id="menu-navigation-container"></div>

  <header class="app-header" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;">
    
    <!-- Left: Brand Title / Logo -->
    <div class="logo-container">
      <h1 style="margin: 0;">Wishes Hub</h1>
    </div>

    <!-- Right Controls: Dark Mode Button + Hamburger (3 Lines) Below It -->
    <div class="header-right-controls" style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
      
      <!-- Theme Toggle Button -->
      <button id="theme-toggle-btn" class="theme-btn">🌙 Theme</button>

      <!-- ☰ Hamburger Toggle Button (Positioned Below Theme Button) -->
      <button id="menu-toggle-btn" class="menu-btn" aria-label="Toggle Navigation" style="background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 4px;">
        <span style="width: 24px; height: 3px; background-color: #00f2ff; border-radius: 2px; display: block;"></span>
        <span style="width: 24px; height: 3px; background-color: #00f2ff; border-radius: 2px; display: block;"></span>
        <span style="width: 24px; height: 3px; background-color: #00f2ff; border-radius: 2px; display: block;"></span>
      </button>

    </div>

  </header>

  <main class="main-container">
    <div class="input-group">
      <input type="text" id="user-name-input" placeholder="Apna Naam Likhein...">
    </div>

    <div class="search-group">
      <input type="text" id="search-input" placeholder="Wishes khojein...">
      <button id="clear-search-btn" class="clear-btn">✕</button>
    </div>

    <div class="filter-tags">
      <button class="filter-btn active" data-category="All">All</button>
      <button class="filter-btn" data-category="Birthday">Birthday</button>
      <button class="filter-btn" data-category="Anniversary">Anniversary</button>
    </div>

    <div id="wishes-list" class="wishes-container"></div>
  </main>

</body>
</html>
