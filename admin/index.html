<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub Admin - Dashboard</title>

    <!-- Eruda Debugger -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        eruda.init();
        console.log("🛠️ Eruda initialized successfully");
    </script>

    <!-- Absolute CSS Paths -->
    <link rel="stylesheet" href="/admin/style.css">

    <!-- 💥 FORCE FONT KILLER STYLE & SCRIPT -->
    <style id="force-font-style">
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
      
      *, *::before, *::after, body, div, span, p, a, input, button, select, header, nav, aside, ul, li, h1, h2, h3 {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        font-style: normal !important;
      }
    </style>

    <script>
      // Automatically strip all external font stylesheets dynamically
      window.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
          if (link.href.includes('fonts.googleapis') && !link.href.includes('Inter')) {
            link.remove();
          }
        });
      });
    </script>
</head>
<body>

    <div class="mobile-header">
        <span>Wishes Hub Admin</span>
        <button id="toggle-sidebar-btn">☰</button>
    </div>

    <!-- Dynamic Side Menu Mounting Root -->
    <div id="menu-navigation-root"></div>

    <div class="admin-wrapper">
        <main class="content-workspace">
            <div id="dynamic-content-root">
                <p style="padding: 20px; color: #666;">Loading Admin Modules...</p>
            </div>
        </main>
    </div>

    <script type="module" src="/admin/features/features-assembly.js"></script>
</body>
</html>
