<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub | Admin Control</title>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #161b22; padding: 40px; border-radius: 15px; border: 1px solid #30363d; text-align: center; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #00f2ff; margin-bottom: 25px; font-size: 22px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 8px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; background: #00f2ff; color: black; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #00c8d4; }
        button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 13px; color: #00f2ff; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Control Center</h1>
        <div id="login-module">
            <input type="password" id="auth-key" placeholder="Enter Admin Password">
            <button onclick="login()">Unlock System</button>
        </div>
        <div id="main-panel" style="display:none;">
            <p>✅ Access Granted</p>
            <input type="file" id="media-upload" accept="image/*">
            <button id="publish-btn">Send to Telegram</button>
        </div>
        <div id="status"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
