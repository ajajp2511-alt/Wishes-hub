<div class="admin-card music-module">
    <div class="toggle-row">
        <span class="label-text">YouTube Music Mode</span>
        <label class="switch">
            <input type="checkbox" id="ytModeToggle" onchange="switchMusicMode()">
            <span class="slider round"></span>
        </label>
        <span id="modeStatus" style="font-size: 12px; margin-left: 10px; color: #6c5ce7;">Direct Link</span>
    </div>

    <div id="directLinkSection" class="input-group">
        <input type="text" id="directYtUrl" placeholder="Paste YouTube Video URL here...">
    </div>

    <div id="apiSearchSection" class="input-group" style="display: none;">
        <input type="text" id="ytQuery" placeholder="Search song (e.g. Arijit Singh)..." onkeyup="handleYTSearch()">
        <div id="ytSearchResults" class="search-dropdown"></div>
    </div>
</div>
