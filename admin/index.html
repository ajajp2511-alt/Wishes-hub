<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub Admin</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="style-admin.css">
</head>
<body>

    <div class="admin-container">
        <h1>Wishes Hub Admin</h1>[cite: 3]
        
        <!-- Login Module -->
        <div id="login-module">[cite: 3]
            <input type="password" id="admin-pass" placeholder="Enter Password">[cite: 3]
            <button onclick="verifyMasterPassword()">Unlock</button>[cite: 3]
            <p id="status"></p>[cite: 3]
        </div>[cite: 3]

        <!-- Main Panel (Pehle se hidden rahega jab tak auth active na ho) -->
        <div id="main-panel" style="display: none;">[cite: 3]
            <h2>Welcome to Dashboard</h2>
            <p>Admin panel successfully opened!</p>
            <button onclick="logout()">Logout</button>[cite: 3]
        </div>[cite: 3]
    </div>

    <!-- JS Files: Pehle admin-auth load hogi taaki functions pehle register ho sakein -->
    <script src="admin-auth.js"></script> 
    <script src="script.js"></script>
</body>
</html>
