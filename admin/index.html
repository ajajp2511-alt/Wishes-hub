<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Wishes Hub</title>
    <style>
        body { background-color: #0d1117; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-container { background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; text-align: center; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #00f2ff; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #00f2ff; color: black; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #00c8d4; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>Control Center</h1>
        <div id="login-module">
            <input type="password" id="auth-key" placeholder="System Password">
            <button onclick="login()">Unlock System</button>
        </div>
        <div id="main-panel" style="display:none;">
            <input type="file" id="media-upload" accept="image/*">
            <textarea id="caption-text" placeholder="Message..." style="width:100%; height:80px; margin-top:10px; background:#0d1117; color:white; border:1px solid #30363d;"></textarea>
            <button id="publish-btn">Publish to Live</button>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <script src="script.js"></script>
</body>
</html>
