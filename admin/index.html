<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub Admin</title>
    <link rel="stylesheet" href="/admin/style-admin.css">
</head>
<body>

    <div class="admin-container">
        <h1>Wishes Hub Admin</h1>
        
        <div id="login-module">
            <input type="password" id="admin-pass" placeholder="Enter Password">
            <button id="unlock-btn">Unlock</button>
            <p id="status"></p>
        </div>

        <div id="main-panel" style="display: none;">
            <h2>Welcome to Dashboard</h2>
            <p>Admin panel is live and structured!</p>
            <button id="logout-btn">Logout</button>
        </div>
    </div>

    <script src="/admin/features/auth/admin-auth.js"></script>
    <script src="/admin/script.js"></script>
</body>
</html>
