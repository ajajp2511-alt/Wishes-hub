<div class="music-controller">
    <div class="toggle-box">
        <span>YouTube Mode:</span>
        <label class="switch">
            <input type="checkbox" id="ytMode" onchange="toggleYTInput()">
            <span class="slider round"></span>
        </label>
        <small id="modeText">Direct Link</small>
    </div>

    <div id="linkInputArea">
        <input type="text" id="directYTLink" placeholder="Paste YouTube Link here...">
    </div>

    <div id="searchInputArea" style="display:none;">
        <input type="text" id="ytSearchQuery" placeholder="Search Song (e.g. Arijit Singh)..." onkeyup="handleSearch()">
        <div id="ytResults" class="search-results-box"></div>
    </div>
</div>
