<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub Admin - Dashboard</title>

    <!-- 🛑 INSTANT SECURITY GUARD: Page render hone se pehle hi check karega -->
    <script>
        (function() {
            const token = localStorage.getItem('wh_admin_token');
            const role = localStorage.getItem('wh_user_role');
            
            if (!token || !role || token === 'undefined' || token === 'null' || token.trim() === '') {
                window.location.replace('/admin/features/login/login');
            }
        })();
    </script>

    <!-- Eruda Debugger -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        eruda.init();
        console.log("🛠️ Eruda initialized successfully");

        // CSS Load Failure Detector
        document.addEventListener('error', function(event) {
            if (event.target.tagName === 'LINK' && event.target.rel === 'stylesheet') {
                console.error("🚨 CSS Load Error:", event.target.href);
            }
        }, true);
    </script>

    <!-- Master CSS Link -->
    <link rel="stylesheet" href="/admin/features/style-css.css">
</head>
<body>

    <!-- Mobile Top Bar with Logout Button -->
    <header class="responsive-header" style="display: flex; justify-content: space-between; align-items: center; padding: 0 15px;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <button id="toggle-sidebar-btn" class="hamburger-btn" aria-label="Toggle Navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <span>Wishes Hub Admin</span>
        </div>

        <!-- 🚪 Admin Logout Button -->
        <button id="admin-logout-btn" style="background: rgba(220, 53, 69, 0.15); color: #ff6b6b; border: 1px solid rgba(220, 53, 69, 0.4); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: background 0.2s;">
            🚪 Logout
        </button>
    </header>

    <!-- Backdrop Overlay for Mobile -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Dynamic Side Menu Mounting Root -->
    <aside id="menu-navigation-root" class="admin-sidebar"></aside>

    <div class="admin-wrapper">
        <main class="content-workspace">
            <div id="dynamic-content-root">
                <p style="padding: 20px; color: #666;">Loading Admin Modules...</p>
            </div>
        </main>
    </div>

    <!-- Mobile Sidebar & Logout JS Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('toggle-sidebar-btn');
            const backdrop = document.getElementById('sidebar-backdrop');
            const logoutBtn = document.getElementById('admin-logout-btn');

            function toggleMenu() {
                document.body.classList.toggle('sidebar-mobile-open');
                if (backdrop) {
                    backdrop.classList.toggle('backdrop-active');
                }
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', toggleMenu);
            }
            if (backdrop) {
                backdrop.addEventListener('click', toggleMenu);
            }

            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    localStorage.removeItem('wh_admin_token');
                    localStorage.removeItem('wh_user_role');
                    window.location.replace('/admin/features/login/login');
                });
            }
        });
    </script>

    <!-- ✅ Absolute Path Fix for Vercel Module Loading -->
    <script type="module" src="/admin/features/features-assembly.js"></script>
</body>
</html>
