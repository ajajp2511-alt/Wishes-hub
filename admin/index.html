<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub Admin</title>
    <link rel="stylesheet" href="style-admin.css">
</head>
<body>
    <div class="box">
        <h1 id="auth-title">Admin Access</h1>
        
        <div id="login-module">
            <input type="password" id="admin-pass" placeholder="Enter Master Password">
            <button id="auth-btn" onclick="verifyMasterPassword()">Unlock System</button>
        </div>

        <div id="main-panel" style="display:none;">
            <p style="color: #238636; font-weight: bold;">✅ Access Granted</p>
            <hr style="border: 0.5px solid #30363d; margin: 20px 0;">
            
            <input type="file" id="media-upload" accept="image/*" style="margin-bottom: 10px;">
            <button id="publish-btn">Send to Telegram</button>
            
            <button onclick="logout()" style="background:transparent; color:#f85149; border:1px solid #f85149; margin-top:20px;">Logout</button>
        </div>
        
        <div id="status"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
