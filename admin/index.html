<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub Admin</title>
    <link rel="stylesheet" href="style-admin.css">
</head>
<body>

    <div class="admin-container">
        <h1>Wishes Hub Admin</h1>
        
        <!-- Login Module -->
        <div id="login-module">
            <input type="password" id="admin-pass" placeholder="Enter Password">
            <button onclick="verifyMasterPassword()">Unlock</button>
            <p id="status"></p>
        </div>

        <!-- Main Panel -->
        <div id="main-panel" style="display: none;">
            <h2>Welcome to Dashboard</h2>
            <p>Admin panel successfully opened!</p>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Ab sirf ek hi JS file load hogi -->
    <script src="script.js"></script>
</body>
</html>
