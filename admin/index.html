<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub Admin - Dashboard</title>

    <!-- 🛠️ Eruda Mobile Debugger (URL: ?debug=true hone par load hoga) -->
    <script>
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            // Agar URL me ?debug=true pass karenge ya localStorage me active hoga
            if (urlParams.get('debug') === 'true' || localStorage.getItem('active-eruda') === 'true') {
                const script = document.createElement('script');
                script.src = "//cdn.jsdelivr.net/npm/eruda";
                document.head.appendChild(script);
                script.onload = function () {
                    eruda.init();
                    console.log("🛠️ Eruda Mobile Console Active!");
                };
            }
        })();
    </script>

    <!-- Main CSS Assembly File -->
    <link rel="stylesheet" href="./style-css.css">
</head>
<body>

    <!-- Mobile Header -->
    <div class="mobile-header">
        <span>Wishes Hub Admin</span>
        <button id="toggle-sidebar-btn">☰</button>
    </div>

    <!-- Main Workspace -->
    <div class="admin-wrapper">
        <main class="content-workspace">
            <!-- Dynamic Content Area -->
            <div id="dynamic-content-root">
                <!-- Modules yahan inject honge -->
            </div>
        </main>
    </div>

    <!-- Main JS Assembly File -->
    <script type="module" src="./responsive-admin.js"></script>
    <script type="module" src="./features-assembly.js"></script>
</body>
</html>
