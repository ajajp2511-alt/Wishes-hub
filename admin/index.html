<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Wishes Hub</title>
    <style>
        /* Sari design yahan hai taaki link na toote */
        body { background: #0d1117; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #161b22; padding: 35px; border-radius: 15px; border: 1px solid #30363d; text-align: center; width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        h1 { color: #00f2ff; margin-bottom: 25px; font-size: 1.6rem; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 8px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; background: #00f2ff; color: black; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #00c8d4; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Control Center</h1>
        <div id="login-ui">
            <input type="password" id="admin-pass" placeholder="Enter Password">
            <button onclick="checkAccess()">Unlock System</button>
        </div>
        <div id="admin-ui" style="display:none;">
            <input type="file" id="upload" accept="image/*">
            <textarea placeholder="Message..."></textarea>
            <button>Publish to Live</button>
        </div>
    </div>

    <script>
        function checkAccess() {
            // Ye temporary login hai taaki aap screen dekh sakein
            const p = document.getElementById('admin-pass').value;
            if(p === "123") { // Apna password check karein
                document.getElementById('login-ui').style.display = 'none';
                document.getElementById('admin-ui').style.display = 'block';
            } else {
                alert("Checking system...");
                // Agar aapka script.js live hai toh ye usse connect ho jayega
                if(typeof login === "function") { login(); }
            }
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
