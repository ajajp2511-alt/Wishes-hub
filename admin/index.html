<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub Admin - Dashboard</title>
    <link rel="stylesheet" href="/admin/style.css">
    <link rel="stylesheet" href="/admin/css/admin-logo-upload.css">
</head>
<body>

    <div class="mobile-header" style="background: var(--sidebar-bg); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; color: white; border-bottom: 1px solid var(--sidebar-hover);">
        <span style="font-weight: 600; font-size: 18px; font-family: 'Segoe UI', sans-serif;">Wishes Hub Admin</span>
        <button id="toggle-sidebar-btn" style="color: white; background: none; border: none; font-size: 24px; cursor: pointer; padding: 5px 10px; line-height: 1;">☰</button>
    </div>

    <div class="admin-wrapper">
        
        <main class="content-workspace">
            <!-- 🔥 Yeh root area active hona zaroori hai, JS isi ke andar HTML dynamically render karega -->
            <div id="dynamic-content-root"></div>
        </main>

    </div>

    <!-- 🔥 Cache todne ke liye sabhi files ke piche ?v=2.1 attach kiya hai -->
    <script src="/admin/features/wishes/category-data.js?v=2.1"></script>
    <script src="/admin/features/media/media-uploader.js?v=2.1"></script>
    <script src="/admin/features/settings/settings.js?v=2.1"></script> 
    <script src="/admin/js/dashboard-init.js?v=2.1"></script>
    <script type="module" src="/admin/js/admin-logo-uploader.js?v=2.1"></script>
    
    <!-- 🎵 YOUTUBE SEARCH SCRIPT JO PEHLE MISSING THI -->
    <script src="/admin/features/song/youtube-song-search.js?v=2.1"></script>

    <!-- 🔗 NEW AUTOMATIC URL PREVIEW LINKER MODULE (Patel Studio Engine) -->
    <script src="/admin/features/song/youtube-url-linker.js?v=2.1"></script>
</body>
</html>
