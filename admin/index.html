<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub Admin - Dashboard</title>

    <!-- Eruda Debugger -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        eruda.init();
        console.log("🛠️ Eruda initialized successfully");

        // CSS Load Failure Detector
        document.addEventListener('error', function(event) {
            if (event.target.tagName === 'LINK' && event.target.rel === 'stylesheet') {
                console.error("🚨 CSS Load Error:", event.target.href);
            }
        }, true);
    </script>

    <!-- Master CSS Link -->
    <link rel="stylesheet" href="/admin/features/style-css.css">
    <!-- Admin Login CSS Link -->
    <link rel="stylesheet" href="/admin/features/auth-security/modules/admin-login.css">
</head>
<body>

    <!-- Mobile Top Bar -->
    <header class="responsive-header">
        <button id="toggle-sidebar-btn" class="hamburger-btn" aria-label="Toggle Navigation">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        <span>Wishes Hub Admin</span>
    </header>

    <!-- Backdrop Overlay for Mobile -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Dynamic Side Menu Mounting Root -->
    <aside id="menu-navigation-root" class="admin-sidebar"></aside>

    <div class="admin-wrapper">
        <main class="content-workspace">
            <div id="dynamic-content-root">
                <p style="padding: 20px; color: #666;">Loading Admin Modules...</p>
            </div>
        </main>
    </div>

    <!-- Mobile Sidebar Toggle JS Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('toggle-sidebar-btn');
            const backdrop = document.getElementById('sidebar-backdrop');

            function toggleMenu() {
                document.body.classList.toggle('sidebar-mobile-open');
                if (backdrop) {
                    backdrop.classList.toggle('backdrop-active');
                }
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', toggleMenu);
            }
            if (backdrop) {
                backdrop.addEventListener('click', toggleMenu);
            }
        });
    </script>

    <!-- Authentication & Main Assembly Entry Script -->
    <script type="module">
        import { authAssemblyInstance } from '/admin/features/auth-security/auth-assembly.js';

        document.addEventListener('DOMContentLoaded', () => {
            // Check karein ki admin logged in hai ya nahi
            if (!authAssemblyInstance.isLoggedIn()) {
                // Agar logged in nahi hai, toh dashboard hata kar login view render karein
                document.body.innerHTML = '<div id="admin-login-root" style="width:100%; min-height:100vh;"></div>';
                authAssemblyInstance.loginView.render(document.getElementById('admin-login-root'));
            } else {
                // Agar logged in hai, toh normal features assembly load karein
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '/admin/features/features-assembly.js';
                document.body.appendChild(script);
            }
        });
    </script>
</body>
    </html>
