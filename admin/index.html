<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub Admin - Dashboard</title>
    <link rel="stylesheet" href="/admin/style.css">
</head>
<body>

    <div class="mobile-header" style="background: var(--sidebar-bg); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; color: white;">
        <span style="font-weight: 600; font-size: 18px;">Wishes Hub Admin</span>
        <button id="toggle-sidebar-btn" style="color: white; margin-bottom: 0; padding: 5px 10px;">☰</button>
    </div>

    <div class="admin-wrapper">
        
        <main class="content-workspace">
            <div id="feature-content-area">
                <div class="feature-card">
                    <h2 style="margin-bottom: 20px;">Add New Wish</h2>
                    <div class="form-group">
                        <select id="main-category">
                            <option>Select Main Category</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <select id="sub-category">
                            <option>Select Sub Category</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <textarea id="wish-text" class="rich-editor" placeholder="Enter your wish text here..."></textarea>
                    </div>
                    <div class="form-group">
                        <input type="file" id="wish-image" style="background: #1e293b; color: white;">
                    </div>
                    <button class="primary-action-btn">Submit Wish</button>
                </div>
            </div>
        </main>

    </div>

    <script src="/admin/js/dashboard-init.js"></script>
</body>
</html>
