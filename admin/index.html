<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Wishes Hub</title>
    <link rel="stylesheet" href="../public/style-ui.css">
    <link rel="stylesheet" href="style-admin.css">
</head>
<body>
    <div id="admin-app" class="admin-container">
        <header>
            <h1 style="color: #00f2ff;">Control Center</h1>
        </header>

        <div id="login-module">
            <input type="password" id="auth-key" placeholder="System Password">
            <button onclick="login()">Unlock</button>
        </div>

        <div id="main-panel" style="display:none;">
            <div class="upload-section">
                <input type="file" id="media-upload" accept="image/*">
                <textarea id="caption-text" placeholder="Enter message..."></textarea>
                <button id="publish-btn">Publish to Live</button>
            </div>
            <div id="console-output"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <script src="Script.js"></script>
</body>
</html>
