<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Wishes Hub</title>
    
    <style>
        body { 
            background-color: #0d1117; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .admin-container { 
            width: 100%;
            max-width: 400px; 
            padding: 20px;
            border: 1px solid #30363d; 
            border-radius: 12px; 
            background: #161b22; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        input, textarea, button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            box-sizing: border-box;
        }
        button {
            background: #00f2ff;
            color: black;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #00c8d4; }
        #console-output { margin-top: 15px; font-family: monospace; font-size: 12px; color: #00f2ff; }
    </style>
</head>
<body>
    <div id="admin-app" class="admin-container">
        <header>
            <h1 style="color: #00f2ff; text-align: center; margin-top: 0;">Control Center</h1>
        </header>

        <div id="login-module" style="text-align: center;">
            <input type="password" id="auth-key" placeholder="System Password">
            <button onclick="login()">Unlock System</button>
        </div>

        <div id="main-panel" style="display:none;">
            <p style="color: #888; margin-bottom: 5px;">Upload New Wish:</p>
            <input type="file" id="media-upload" accept="image/*">
            <textarea id="caption-text" placeholder="Enter message..." rows="4"></textarea>
            <button id="publish-btn">Publish to Live</button>
            <div id="console-output"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <script src="script.js"></script>
</body>
                </html>
