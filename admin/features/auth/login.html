<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub - Admin Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <!-- Root Container -->
    <div id="admin-login-root"></div>

    <script type="module">
        import { AdminLoginView } from './admin-login-view.js';

        // Successful login ke baad dashboard par redirect karein
        const loginView = new AdminLoginView(() => {
            window.location.href = '../index.html'; // Aapke main dashboard ka path
        });

        loginView.render(document.getElementById('admin-login-root'));
    </script>
</body>
</html>
