<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub - Admin Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <!-- Root Container jahan login view render hoga -->
    <div id="admin-login-root"></div>

    <!-- Login Logic & Security Modules Import from 'auth-security' folder -->
    <script type="module">
        import { AdminLoginView } from '../auth-security/modules/admin-login-view.js';

        // Jab login successful ho jaye, tab admin dashboard par redirect karein
        const loginView = new AdminLoginView(() => {
            window.location.href = '../dashboard.html'; // Aapke main admin dashboard ka path
        });

        loginView.render(document.getElementById('admin-login-root'));
    </script>
</body>
</html>
