<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub Admin - Private Sign-In</title>
    <!-- Absolute Path for CSS -->
    <link rel="stylesheet" href="/admin/features/sign-in/assets/form.css">
</head>
<body class="admin-signin-wrapper">

    <!-- Secure Dynamic Root Container -->
    <div class="admin-signin-card" id="signInRoot">
        <div class="admin-signin-header">
            <h2>🔐 Verifying Security & Invite Link...</h2>
            <p>Please wait while we validate your access token and secure environment.</p>
        </div>
    </div>

    <!-- Secure Dynamic Entry Point Module -->
    <script type="module">
        import { initSignInPortal } from '/admin/features/sign-in/modules/sign-in-ui.js';

        document.addEventListener('DOMContentLoaded', () => {
            initSignInPortal('signInRoot');
        });
    </script>
</body>
</html>
