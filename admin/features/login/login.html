<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishes Hub - Admin Portal Login</title>
    <!-- Link CSS File -->
    <link rel="stylesheet" href="login.css">
    <!-- Eruda Mobile Debugger Console -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h2>Wishes Hub 🚀</h2>
            <p>Secure Enterprise Admin Portal</p>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label for="admin-email">Admin Email</label>
                <input type="email" id="admin-email" required placeholder="admin@wisheshub.com" autocomplete="email">
            </div>

            <div class="input-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" required placeholder="••••••••••••" autocomplete="current-password">
            </div>

            <div class="login-actions">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-secondary);">
                    <input type="checkbox" id="remember-me" style="accent-color: var(--accent-color);"> Remember device
                </label>
                <a href="#" id="forgot-password-link">Forgot Password?</a>
            </div>

            <button type="submit" id="login-submit-btn" class="btn-primary">Sign In to Dashboard</button>
        </form>
        
        <div style="text-align: center; margin-top: 20px;">
            <button type="button" id="passkey-login-btn" class="btn-secondary" style="width: 100%;">🔑 Sign in with Passkey / Biometric</button>
        </div>
    </div>

    <!-- Load Core Controller as ES Module -->
    <script type="module" src="login-core.js"></script>
    <!-- Load UI Helper Script -->
    <script type="module" src="login-ui.js"></script>
</body>
</html>
