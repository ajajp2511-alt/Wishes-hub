<div id="feature-content-area" class="live-preview-container">
    
    <div class="feature-card content-entry-card">
        <h2 class="section-title">Add New Multi-Media Wish</h2>
        
        <div class="form-group">
            <label for="main-category">Main Category</label>
            <select id="main-category">
                <option value="">Select Main Category</option>
            </select>
        </div>

        <div class="form-group">
            <label for="sub-category">Sub Category</label>
            <select id="sub-category">
                <option value="">Select Sub Category</option>
            </select>
        </div>

        <div class="form-group">
            <label for="wish-text">Wish Content Text</label>
            <textarea id="wish-text" class="rich-editor" placeholder="Enter your wish text here..."></textarea>
        </div>

        <div class="audio-tabs-container" style="display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">
            <button type="button" id="tab-yt-search" class="tab-btn active" style="padding: 8px 16px; border: none; background: #4f46e5; color: white; border-radius: 4px; cursor: pointer; font-weight: 600;">🔍 Search on YouTube</button>
            <button type="button" id="tab-voice-record" class="tab-btn" style="padding: 8px 16px; border: none; background: #e2e8f0; color: #475569; border-radius: 4px; cursor: pointer; font-weight: 600;">🎙️ Record Voice</button>
        </div>

        <div id="panel-yt-search" class="audio-panel">
            <div class="form-group" style="display: flex; gap: 8px; align-items: flex-end;">
                <div style="flex: 1;">
                    <label for="yt-search-input">Search Song / Track</label>
                    <input type="text" id="yt-search-input" class="text-input" placeholder="Type song name, artist, or movie...">
                </div>
                <button type="button" id="yt-search-btn" style="padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; height: 42px;">Search</button>
            </div>
            
            <div id="yt-search-results" style="margin-top: 12px; max-height: 200px; overflow-y: auto; display: none; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; background: #f8fafc;">
                </div>
            <input type="hidden" id="selected-yt-video-id" value="">
        </div>

        <div id="panel-voice-record" class="audio-panel" style="display: none;">
            <div class="recorder-controls" style="display: flex; gap: 10px; margin-top: 10px;">
                <button type="button" id="start-rec-btn" style="padding: 10px 16px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer;">🔴 Start Record</button>
                <button type="button" id="stop-rec-btn" style="padding: 10px 16px; background: #64748b; color: white; border: none; border-radius: 6px; cursor: pointer;" disabled>⏹️ Stop</button>
            </div>
            <div id="voice-preview-container" style="margin-top: 12px;"></div>
        </div>

        <button class="primary-action-btn" id="submit-wish-btn" style="margin-top: 20px;">Submit Wish</button>
    </div>

    <div class="feature-card dynamic-preview-status-card">
        <h3 class="subsection-title">✨ Smart Media Live Preview Status</h3>
        <div id="live-preview-box" class="preview-output-wrapper">
            <p class="empty-state-text">Abhi tak koi naya data ya file upload nahi ki gayi hai.</p>
        </div>
    </div>

</div>
